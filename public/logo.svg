<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#166534;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#78350f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a16207;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#f0fdf4"/>
  <!-- Tree crown -->
  <ellipse cx="256" cy="180" rx="140" ry="130" fill="url(#treeGradient)"/>
  <ellipse cx="190" cy="220" rx="80" ry="70" fill="url(#treeGradient)"/>
  <ellipse cx="322" cy="220" rx="80" ry="70" fill="url(#treeGradient)"/>
  <ellipse cx="256" cy="260" rx="100" ry="80" fill="url(#treeGradient)"/>
  <!-- Tree trunk -->
  <rect x="230" y="300" width="52" height="120" rx="8" fill="url(#trunkGradient)"/>
  <!-- Ground -->
  <ellipse cx="256" cy="420" rx="100" ry="20" fill="#166534" opacity="0.3"/>
</svg>
